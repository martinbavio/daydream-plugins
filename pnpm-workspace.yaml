packages:
  - "plugins/*"

# The kernel every plugin builds and tests against: one commit, named once.
# Each package.json asks for these as `catalog:`, and the root's override
# pins the API the same way, so a bump is this commit hash and nothing else
# (README.md, "The kernel pin").
catalog:
  "@daydream/plugin-api": github:mbavio-phota/daydream#ef5705ae53dc66b5e25e470efb039579596770ca&path:packages/plugin-api
  "@daydream/plugin-testing": github:mbavio-phota/daydream#ef5705ae53dc66b5e25e470efb039579596770ca&path:packages/plugin-testing
