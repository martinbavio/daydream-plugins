packages:
  - "plugins/*"

# The kernel every plugin builds and tests against: one commit, named once.
# Each package.json asks for these as `catalog:`, and the root's override
# pins the API the same way, so a bump is this commit hash and nothing else
# (README.md, "The kernel pin").
catalog:
  "@daydream/plugin-api": github:mbavio-phota/daydream#d835797321550a54fc1bddd82e2a34e778c96a83&path:packages/plugin-api
  "@daydream/plugin-testing": github:mbavio-phota/daydream#d835797321550a54fc1bddd82e2a34e778c96a83&path:packages/plugin-testing
