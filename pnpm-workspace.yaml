packages:
  - "plugins/*"

# The kernel every plugin builds and tests against: one commit, named once.
# Each package.json asks for these as `catalog:`, and the root's override
# pins the API the same way, so a bump is this commit hash and nothing else
# (README.md, "The kernel pin").
catalog:
  "@daydream/plugin-api": github:mbavio-phota/daydream#88cb7f20db0cbf2d4631a693fe12b8eac08a6c1b&path:packages/plugin-api
  "@daydream/plugin-testing": github:mbavio-phota/daydream#88cb7f20db0cbf2d4631a693fe12b8eac08a6c1b&path:packages/plugin-testing
