packages:
  - "plugins/*"

# The kernel every plugin builds and tests against: one commit, named once.
# Each package.json asks for these as `catalog:`, and the root's override
# pins the API the same way, so a bump is this commit hash and nothing else
# (README.md, "The kernel pin").
catalog:
  "@daydream/plugin-api": github:mbavio-phota/daydream#0559405cb2b1b01732a62f9c6850f55c1263a01d&path:packages/plugin-api
  "@daydream/plugin-testing": github:mbavio-phota/daydream#0559405cb2b1b01732a62f9c6850f55c1263a01d&path:packages/plugin-testing
