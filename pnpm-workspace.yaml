packages:
  - "plugins/*"

# The kernel every plugin builds and tests against: one commit, named once.
# Each package.json asks for these as `catalog:`, and the root's override
# pins the API the same way, so a bump is this commit hash and nothing else
# (README.md, "The kernel pin").
catalog:
  "@daydream/plugin-api": github:mbavio-phota/daydream#c24d4d82350ca1a4e554af02fb50a51d4f2b79ab&path:packages/plugin-api
  "@daydream/plugin-testing": github:mbavio-phota/daydream#c24d4d82350ca1a4e554af02fb50a51d4f2b79ab&path:packages/plugin-testing
